# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false
tone_instructions: "Senior Python Engineer (15y, top 1%). Direct, cite PEPs. Focus: security, performance, async. Flag blocking I/O immediately. Priority: Critical > Security > Perf"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "🤖 AI-Generated PR Summary"
  poem: true
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true

  path_filters:
    - "!dist/**"
    - "!build/**"
    - "!*.pyc"
    - "!__pycache__/**"
    - "!.venv/**"
    - "!venv/**"
    - "!*.egg-info/**"
    - "!.mypy_cache/**"
    - "!.pytest_cache/**"
    - "!.ruff_cache/**"
    - "!htmlcov/**"
    - "!.coverage"
    - "!coverage.xml"
    - "src/**/*.py"
    - "yandex_bot/**/*.py"
    - "tests/**/*.py"
    - "*.py"
    - "pyproject.toml"
    - "requirements*.txt"
    - ".github/workflows/*.yml"

  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        ## Type Safety & Static Analysis
        - ALL functions/methods MUST have complete type hints (params + return type)
        - Use Python 3.11+ syntax: `list[str]` not `List[str]`, `dict[str, int]` not `Dict[str, int]`
        - Complex types: use TypeAlias or Pydantic models, not nested generics
        - Flag any `Any` type - require specific types
        - No `type: ignore` comments without explanation

        ## Async/Await Best Practices
        - ALL I/O operations MUST be async (no blocking calls)
        - Flag any `open()`, `requests.*`, `time.sleep()` in async functions
        - Use `asyncio.gather()` for concurrent operations, not sequential awaits
        - Proper exception handling for `asyncio.CancelledError`
        - Resource cleanup via `async with` context managers
        - Check for race conditions in async code

        ## Error Handling
        - NO bare `except:` clauses - always specify exception types
        - Custom exceptions should inherit from appropriate base (ValueError, RuntimeError, etc.)
        - All exceptions must have descriptive messages
        - Log errors before re-raising
        - Validate all external inputs (API responses, user data)

        ## Code Quality
        - Functions under 50 lines (flag for refactoring if exceeded)
        - Cyclomatic complexity under 10
        - Max 5 parameters per function (use dataclasses/Pydantic for more)
        - No mutable default arguments (`def foo(x=[]): ...`)
        - No global state modifications
        - DRY principle: flag code duplication > 5 lines

        ## Documentation
        - ALL public APIs must have Google-style docstrings
        - Include: brief description, Args, Returns, Raises, Examples
        - Document side effects explicitly
        - Flag missing docstrings on public functions/classes

        ## Security
        - No hardcoded credentials, API keys, tokens
        - No SQL injection vulnerabilities (use parameterized queries)
        - Proper input validation and sanitization
        - No use of `eval()`, `exec()`, `__import__()`
        - Flag any `shell=True` in subprocess calls
        - Check for timing attack vulnerabilities in authentication

        ## Performance
        - Use generators for large datasets, not lists
        - Prefer set/dict lookups over list iteration for membership tests
        - Flag N+1 query patterns
        - Check for unnecessary deep copies
        - Efficient string concatenation (use join, not +=)
        - Proper use of caching (`@lru_cache`, `@cached_property`)

    - path: "yandex_bot/**/*.py"
      instructions: |
        ## API Integration
        - All HTTP calls must use async httpx, not requests
        - Proper timeout configuration (connect + read timeouts)
        - Retry logic with exponential backoff for transient failures
        - Rate limiting implementation for API calls
        - Proper error handling for HTTP 4xx/5xx responses

        ## Pydantic Models
        - Use Pydantic v2 syntax (`model_validate`, not `parse_obj`)
        - Field validators for complex validation logic
        - Proper use of `ConfigDict` for model configuration
        - JSON schema generation for API documentation

        ## Bot Architecture
        - Separation: handlers (presentation) -> services (business) -> repositories (data)
        - No direct HTTP calls in business logic (use dependency injection)
        - Event handlers should be thin wrappers (delegate to services)
        - Stateless design where possible
        - Proper logging with structured context (structlog)

    - path: "tests/**/*.py"
      instructions: |
        ## Test Naming & Structure
        - Function names: `test_<component>_<scenario>_<expected_outcome>`
        - Example: `test_message_handler_invalid_token_raises_auth_error`
        - Group related tests in classes: `class TestMessageHandler:`
        - One assertion concept per test (not one assert, but one logical concept)

        ## Fixtures & Parametrization
        - Use pytest fixtures for setup/teardown, not setUp/tearDown methods
        - Parametrize tests for multiple scenarios, don't duplicate test code
        - Fixture scope: use appropriate scope (function/class/module/session)
        - No fixture interdependencies (each should be independently usable)

        ## Async Tests
        - Use `@pytest.mark.asyncio` for async tests
        - Mock async dependencies properly (AsyncMock, not Mock)
        - Test both success and failure paths for async operations
        - Test timeout behavior and cancellation

        ## Assertions & Coverage
        - ALL assertions must have descriptive messages
        - Example: `assert result == expected, f"Expected {expected}, got {result}"`
        - Test edge cases: empty inputs, None values, boundary conditions
        - Test error conditions: invalid inputs, network failures, timeouts
        - Critical paths (auth, data validation, API calls) must have 100% coverage

        ## Mocking & Isolation
        - Use `pytest-mock` for mocking, not unittest.mock directly
        - Mock external dependencies (HTTP calls, database, file I/O)
        - Verify mock calls with `assert_called_once_with()` or `assert_called_with()`
        - No shared state between tests (each test must be isolated)
        - Clean up mocks after tests (`mocker.resetall()`)

        ## Property-Based Testing
        - Use `hypothesis` for complex validation logic
        - Flag opportunities for property-based tests:
          - Parser functions (any input should not crash)
          - Serialization/deserialization (roundtrip property)
          - Mathematical operations (commutativity, associativity)

    - path: "pyproject.toml"
      instructions: |
        - Version constraints: use `>=X.Y.Z,<X+1` for dependencies (caret-style)
        - All dev dependencies in `[project.optional-dependencies.dev]`
        - Proper Python version constraint: `requires-python = ">=3.11"`
        - Tool configurations (ruff, mypy, pytest) must be comprehensive
        - No deprecated configuration options

    - path: ".github/workflows/*.yml"
      instructions: |
        - Use latest action versions (check for updates)
        - Pin action versions with SHA for security: `uses: actions/checkout@v4.1.0`
        - Proper permissions: minimal required (principle of least privilege)
        - Secrets handling: use GitHub Secrets, never hardcode
        - Job dependencies: use `needs:` for proper ordering
        - Matrix strategy for multi-version testing
        - Cache dependencies for faster builds
        - Fail fast: `fail-fast: true` in strategy when appropriate

    - path: "main.py"
      instructions: |
        - Minimal logic in entry point (delegate to modules)
        - Configuration from environment variables, not hardcoded
        - Proper logging setup before any business logic
        - Graceful shutdown handling (SIGTERM, SIGINT)
        - Exception handling at top level (catch-all with logging)
        - Clear error messages for configuration issues

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - main
      - master
      - develop

  tools:
    ruff:
      enabled: true
    semgrep:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
