[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yandex-messenger-bot-async"
version = "0.1.0"
description = "Async Python client for Yandex Messenger Bot API with production-safe defaults"
authors = [
    {name = "yandex-bot-async contributors", email = ""},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["yandex", "bot", "api", "async", "messenger", "httpx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "anyio>=3.7.0",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests",
    "structlog>=23.1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/yandex-messenger-bot-async"
Repository = "https://github.com/your-org/yandex-messenger-bot-async"
Issues = "https://github.com/your-org/yandex-messenger-bot-async/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ymbot_async"]



[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "structlog.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=ymbot_async",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (component interaction)",
    "e2e: End-to-end tests (real API, requires REAL_BOT_TOKEN)",
    "smoke: Smoke tests (quick validation)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.21.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.14.14",
    "pre-commit>=4.5.1",
]
