# Mypy configuration for type checking

[mypy]
# Python version
python_version = 3.11

# Treat missing type hints as errors
disallow_untyped_defs = True

# Treat all untyped calls as errors
# Disable for external dependencies
disallow_untyped_calls = False

# Disallow mixed type definitions
# Allow some incomplete defs during development
disallow_incomplete_defs = False

# Check that function bodies have no Any
disallow_any_unimported = True

# Check for untyped decorators
# Allow untyped decorators
disallow_untyped_decorators = False

# Warn about unused ignores
warn_unused_ignores = True

# Warn about any return
warn_return_any = True

# Warn about unused variables
warn_unused_configs = True

# Show error codes
show_error_codes = True

# Show error context
show_error_context = True

# Show column numbers
show_column_numbers = True

# Show absolute file path
show_absolute_path = False

# Pretty print output
pretty = True

# Color output
color_output = True

# Error summary
error_summary = True

# Ignore missing imports for third-party libraries
ignore_missing_imports = True

# Strict mode (uncomment for stricter checking)
# strict = True

# Per-module settings
[mypy-tests.*]
# Allow less strict typing in tests
disallow_untyped_defs = False
disallow_any_unimported = False
warn_return_any = False

[mypy-ymbot_async.transport.httpx_transport]
# Allow using types from imported modules without TYPE_CHECKING
disallow_any_unimported = False

[mypy-ymbot_async.*]
# Package-specific settings
check_untyped_defs = True
